appId: com.chatgpt-web-harness.desktop
productName: ChatGPT Web Harness
copyright: MIT
directories:
  output: release
  buildResources: build
files:
  - src/**
  - renderer/**
  - package.json
extraResources:
  - from: staging/harness
    to: harness
  # electron-builder drops a root-level node_modules directory when it is
  # copied as part of another resource; map it explicitly to retain runtime deps.
  - from: staging/harness/node_modules
    to: harness/node_modules
  - from: build/icon.png
    to: icon.png
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: "${productName}-${version}-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ChatGPT Web Harness
  artifactName: "${productName}-${version}-setup.${ext}"
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-portable.${ext}"
  # The build script patches electron-builder's portable NSIS template to use
  # a short per-process $TEMP\cgh-<pid> root. This keeps the complete runtime
  # tree below MAX_PATH while preserving concurrent launch isolation.
  useZip: false
  unpackDirName: true
