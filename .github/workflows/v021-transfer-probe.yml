name: v0.2.1 Transfer Probe

on:
  push:
    branches:
      - "release/v0.2.1-actions"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download checksum probe from isolated transfer channel
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            'https://temp.sh/XkLDQ/SHA256SUMS-0.2.1.txt' \
            --output /tmp/SHA256SUMS-0.2.1.txt
          test "$(stat -c%s /tmp/SHA256SUMS-0.2.1.txt)" = "351"
          echo '6334a2aa9952976c5806646093216ed402044ed873ab0372867ad8a5fed30840  /tmp/SHA256SUMS-0.2.1.txt' | sha256sum --check --strict
          echo V021_TRANSFER_PROBE_OK
