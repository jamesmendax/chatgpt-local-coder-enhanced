name: Backfill Historical Release Assets

on:
  push:
    branches:
      - "release/asset-backfill-20260911"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BASE_URL: "https://jacob-triple-valued-nations.trycloudflare.com"
      ACCESS_PATH: "94a57a06b7d142d48a90240d0b86ca3c8f218eca7aba4a039bcdcd027274794f"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Backfill verified local assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          while IFS='|' read -r id tag name sha bytes; do
            [ -n "$id" ] || continue
            echo "=== $tag :: $name ==="
            remote="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -r --arg n "$name" '.assets[] | select(.name==$n) | [.id,.size,(.digest // "")] | @tsv' | head -n1 || true)"
            if [ -n "$remote" ]; then
              IFS=$'\t' read -r asset_id remote_size remote_digest <<< "$remote"
              if [ "$remote_size" = "$bytes" ] && { [ -z "$remote_digest" ] || [ "$remote_digest" = "sha256:$sha" ]; }; then
                echo "SKIP already verified on GitHub"
                continue
              fi
              echo "Removing mismatched existing asset id=$asset_id"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
            out="/tmp/release-assets/$name"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --max-time 7200 "$BASE_URL/$ACCESS_PATH/$id" --output "$out"
            actual_bytes="$(stat -c%s "$out")"
            [ "$actual_bytes" = "$bytes" ] || { echo "size mismatch: expected=$bytes actual=$actual_bytes"; exit 1; }
            echo "$sha  $out" | sha256sum --check --strict
            gh release upload "$tag" "$out"
            remote="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -r --arg n "$name" '.assets[] | select(.name==$n) | [.size,(.digest // "")] | @tsv' | head -n1)"
            IFS=$'\t' read -r remote_size remote_digest <<< "$remote"
            [ "$remote_size" = "$bytes" ] || { echo "GitHub size verification failed"; exit 1; }
            if [ -n "$remote_digest" ] && [ "$remote_digest" != "sha256:$sha" ]; then
              echo "GitHub digest verification failed"
              exit 1
            fi
            rm -f "$out"
            echo "UPLOAD_VERIFIED $tag :: $name :: $sha"
          done <<'ASSETS'
          0|v0.1.0|ChatGPT Web Harness-0.1.0-portable.exe|df9be43b9ff1a485ad5221f2e8ec4e46cb01791032798259d5afe2f3a38cfbe4|153340921
          1|v0.1.0|ChatGPT Web Harness-0.1.0-setup.exe|fbf2492d1b9e8f877f533bd0752bb6983b31ce963c907c822c8a43b8aee8f1a0|107268445
