name: Publish isolated preview

on:
  push:
    branches: ["release/v0.1.4-isolated.1"]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'jamesmendax/chatgpt-local-coder-enhanced'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4

      - name: Verify preview identity
        shell: bash
        run: |
          test "$(node -p "require('./desktop/package.json').name")" = "chatgpt-web-harness-isolated"
          test "$(node -p "require('./desktop/package.json').version")" = "0.1.4-isolated.1"
          test "$(node -p "require('./package.json').repository.url")" = "https://github.com/jamesmendax/chatgpt-local-coder-enhanced.git"

      - name: Retrieve and verify the accepted portable artifact
        shell: bash
        run: |
          asset="ChatGPT-Web-Harness-Isolated-0.1.4-isolated.1-portable.exe"
          expected="ae2465fbd0311c5de2bd972d860b09de8ea6bcff8faa6273d67d9d3ed299acd5"
          source="https://github.com/jamesmendax/chatgpt-local-coder/releases/download/v0.1.4-isolated.1/$asset"
          curl --fail --location --retry 3 --output "$asset" "$source"
          printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --strict
          printf '%s  %s\n' "$expected" "$asset" > "$asset.sha256"

      - name: Create canonical GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v0.1.4-isolated.1"
          asset="ChatGPT-Web-Harness-Isolated-0.1.4-isolated.1-portable.exe"
          gh release create "$tag" \
            "$asset" \
            "$asset.sha256" \
            --target "$GITHUB_SHA" \
            --title "ChatGPT Web Harness Isolated $tag" \
            --notes-file "docs/releases/$tag.md" \
            --prerelease

      - name: Verify published asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v0.1.4-isolated.1"
          asset="ChatGPT-Web-Harness-Isolated-0.1.4-isolated.1-portable.exe"
          expected="sha256:ae2465fbd0311c5de2bd972d860b09de8ea6bcff8faa6273d67d9d3ed299acd5"
          actual="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq ".assets[] | select(.name == \"$asset\") | .digest")"
          test "$actual" = "$expected"
