name: Bug report
description: Report a reproducible problem in ChatGPT Local Coder
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, MCP tokens, tunnel IDs, connector URLs containing credentials, private file contents, or `.env` values.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: commit SHA or release tag
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Call tool ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or errors
      description: Remove secrets, tunnel identifiers, tokens, personal paths, and private content before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets and private data from this report.
          required: true
        - label: I searched existing issues first.
          required: true
